name: Deploy preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

env:
  SITE_DIR: website
  PREVIEW_BUCKET: sample-preview-bucket

jobs:
  preview:
    name: Publish preview artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare preview bundle
        run: |
          mkdir -p dist
          cp -R "$SITE_DIR"/. dist/
          echo "Preview bucket: $PREVIEW_BUCKET"

      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: emoji-gazette-preview-${{ github.event.pull_request.number }}
          path: dist

      - name: Comment preview link
        run: |
          echo "Preview would be available at https://preview.example.com/pr-${{ github.event.pull_request.number }}/"

name: Scheduled website audit

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Weekly content and accessibility audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inventory public files
        run: |
          find website -type f -maxdepth 2 -print | sort

      - name: Run sample accessibility checklist
        run: |
          grep -q 'aria-label="Emoji categories"' website/index.html
          grep -q 'aria-live="polite"' website/index.html
          echo "Sample checks passed. Replace with axe/lighthouse in production."

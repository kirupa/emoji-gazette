name: Website CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required website files
        run: |
          test -f website/index.html
          test -f website/styles.css
          test -f website/script.js

      - name: Check for placeholder production secrets
        run: |
          ! grep -R "AKIA\\|BEGIN PRIVATE KEY\\|password=" -n website

      - name: Summarize artifact
        run: |
          find website -maxdepth 2 -type f -print

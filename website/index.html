<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emoji Library</title>
  <meta name="description" content="A modern emoji browsing page with category filtering.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    THESIS: Emoji browsing becomes a calm design-system library, refusing novelty theming in favor of a practical reference surface.
    OWN-WORLD: Fluent-inspired Segoe typography, neutral app surfaces, rounded tiles, restrained blue actions, and small teal/purple accent fields.
    STORY: visitors understand the full Unicode emoji collection, choose a category, and scan a consistent grid of emoji names.
    FIRST VIEWPORT: a compact top bar, large modern heading, category tabs, and equal-size emoji tiles are visible without summary-card filler.
    FORM: serious modern reference catalog; filtering behaves like a design-system component browser while preserving static-page simplicity.
  -->
  <main class="app-shell">
    <header class="hero" aria-labelledby="page-title">
      <div class="top-bar">
        <a class="brand" href="#" aria-label="Emoji Library home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Emoji Library</span>
        </a>
        <p class="surface-label">Reference catalog</p>
      </div>

      <div class="hero-content">
        <div>
          <p class="eyebrow">Unicode emoji set</p>
          <h1 id="page-title">Browse emoji by category.</h1>
          <p class="intro">
            A focused reference page for scanning the full fully-qualified emoji collection. Use the category controls to narrow the set and keep the grid readable.
          </p>
        </div>
      </div>

      <nav id="category-nav" class="category-nav" aria-label="Emoji categories"></nav>
    </header>

    <section class="catalog-section" aria-labelledby="catalog-heading">
      <div class="section-header">
        <div>
          <p class="eyebrow">Library</p>
          <h2 id="catalog-heading">Emoji catalog</h2>
        </div>
        <p id="results-count" class="results-count" aria-live="polite">Showing Smileys &amp; Emotion emoji.</p>
      </div>

      <div id="emoji-grid" class="emoji-grid" aria-live="polite"></div>
    </section>
  </main>

  <template id="emoji-card-template">
    <article class="emoji-notice">
      <div class="notice-type"></div>
      <div class="emoji-mark" aria-hidden="true"></div>
      <div class="notice-copy">
        <h3></h3>
      </div>
    </article>
  </template>

  <script src="emoji-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
